<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <style>
      text{font-family:Arial,'Helvetica Neue',sans-serif;fill:#172033} .h{font-size:24px;font-weight:700}.t{font-size:18px}.s{font-size:15px}.xs{font-size:13px}.b{font-weight:700}.muted{fill:#657083}.blue{fill:#e8f3ff;stroke:#4088c7}.green{fill:#e8f7ef;stroke:#49a477}.orange{fill:#fff0dc;stroke:#d79036}.yellow{fill:#fff7d6;stroke:#c49a22}.purple{fill:#f0e9ff;stroke:#8767c5}.white{fill:#fff;stroke:#7d8797}.box{stroke-width:2}.lane{fill:#f8fafc;stroke:#c7cfda;stroke-width:1.5}.line{fill:none;stroke:#344055;stroke-width:2.4}.thin{fill:none;stroke:#687489;stroke-width:1.8}.data{fill:none;stroke:#205da8;stroke-width:5}.request{fill:none;stroke:#b36b00;stroke-width:2.3;stroke-dasharray:9 7}.gray{fill:#eef1f4;stroke:#a3abb6}.degraded{fill:#6f7784}.labelbg{fill:#fff;stroke:none;opacity:.95}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#344055"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#205da8"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b36b00"/></marker>
  </defs>

  <rect width="1600" height="800" fill="#ffffff"/>
  <rect class="lane" x="35" y="35" width="660" height="710" rx="18"/>
  <rect class="lane" x="905" y="35" width="660" height="710" rx="18"/>
  <!-- vertical V2V channel: both control request and semantic message cross this band -->
  <rect x="720" y="100" width="160" height="590" rx="18" fill="#e9eef5" stroke="#64748b" stroke-width="2"/>
  <path d="M800 135v520" stroke="#64748b" stroke-width="6" stroke-linecap="round" opacity=".45"/>
  <text class="t b" x="800" y="330" text-anchor="middle" transform="rotate(-90 800 330)">V2V wireless channel (SNR, BLER)</text>
  <text class="h" x="365" y="70" text-anchor="middle">COLLABORATOR SIDE</text>
  <text class="h" x="1235" y="70" text-anchor="middle">EGO SIDE — ON-VEHICLE DECISION</text>

  <!-- collaborator vehicle -->
  <g transform="translate(75 94)">
    <path d="M4 31h8l10-19h51l15 19h13c6 0 10 4 10 10v10H4z" fill="#4c78a8" stroke="#274d76" stroke-width="2"/>
    <circle cx="26" cy="52" r="9" fill="#fff" stroke="#274d76" stroke-width="4"/><circle cx="86" cy="52" r="9" fill="#fff" stroke="#274d76" stroke-width="4"/>
    <path d="M31 16h34l12 15H23z" fill="#dbeeff"/>
  </g>
  <text class="t b" x="205" y="119">Collaborator X<tspan baseline-shift="sub" font-size="13">j</tspan> + LiDAR</text>
  <path class="line" d="M335 132v38" marker-end="url(#arrow)"/>

  <rect class="blue box" x="190" y="170" width="350" height="72" rx="12"/>
  <text class="t b" x="365" y="199" text-anchor="middle">PointPillars / BEV backbone</text>
  <text class="s" x="365" y="226" text-anchor="middle">shared weights</text>

  <!-- collaborator branches -->
  <path class="line" d="M365 242v34M365 276H220v30M365 276h145v30"/>
  <rect class="green box" x="75" y="306" width="290" height="105" rx="12"/>
  <text class="t b" x="220" y="336" text-anchor="middle">Object-level message L</text>
  <text class="t" x="220" y="365" text-anchor="middle">{b, c, p}<tspan baseline-shift="sub" font-size="13">k</tspan></text>
  <text class="s b" x="220" y="393" text-anchor="middle">≈0.024 Msym/frame</text>

  <rect class="orange box" x="395" y="306" width="270" height="105" rx="12"/>
  <text class="t b" x="530" y="336" text-anchor="middle">Feature codec</text>
  <text class="t b" x="530" y="367" text-anchor="middle">C16: 16-QAM</text>
  <text class="s b" x="530" y="393" text-anchor="middle">≈0.99 Msym/frame</text>
  <rect class="gray box" x="395" y="423" width="270" height="81" rx="10"/>
  <text class="xs degraded b" x="530" y="450" text-anchor="middle">C256: 256-QAM, ≈0.495 Msym/frame</text>
  <text class="xs degraded" x="530" y="475" text-anchor="middle">dominated; excluded from deployment</text>
  <text class="xs degraded" x="530" y="493" text-anchor="middle">(§III-B)</text>

  <!-- controlled deployment switch: L and C16 only; C256 intentionally has no connection -->
  <path class="thin" d="M220 411v91"/>
  <path class="thin" d="M665 358h20v160H332v2"/>
  <circle cx="250" cy="528" r="8" fill="#fff" stroke="#344055" stroke-width="2"/>
  <circle cx="332" cy="528" r="8" fill="#fff" stroke="#344055" stroke-width="2"/>
  <path d="M258 524l63-25" stroke="#344055" stroke-width="4" stroke-linecap="round"/>
  <text class="s b" x="290" y="559" text-anchor="middle">select one, controlled by s<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <path class="data" d="M340 528H985v55h65" marker-end="url(#arrowBlue)"/>
  <rect class="labelbg" x="490" y="512" width="202" height="30" rx="4"/>
  <text class="t b" x="591" y="534" text-anchor="middle">m<tspan baseline-shift="sub" font-size="13">t</tspan><tspan baseline-shift="super" font-size="13">s_t</tspan> (one message)</text>

  <!-- ego vehicle -->
  <g transform="translate(940 94)">
    <path d="M4 31h8l10-19h51l15 19h13c6 0 10 4 10 10v10H4z" fill="#4c78a8" stroke="#274d76" stroke-width="2"/>
    <circle cx="26" cy="52" r="9" fill="#fff" stroke="#274d76" stroke-width="4"/><circle cx="86" cy="52" r="9" fill="#fff" stroke="#274d76" stroke-width="4"/>
    <path d="M31 16h34l12 15H23z" fill="#dbeeff"/>
  </g>
  <text class="t b" x="1070" y="112">Ego vehicle X<tspan baseline-shift="sub" font-size="13">e</tspan></text>
  <text class="t b" x="1070" y="143" fill="#9a5a00">“Selector runs on the ego vehicle”</text>
  <text class="s" x="1460" y="113" text-anchor="end">LiDAR</text>
  <path class="line" d="M1390 119v51" marker-end="url(#arrow)"/>

  <rect class="blue box" x="1060" y="170" width="350" height="72" rx="12"/>
  <text class="t b" x="1235" y="199" text-anchor="middle">PointPillars / BEV backbone</text>
  <text class="s" x="1235" y="226" text-anchor="middle">shared weights</text>

  <!-- ego feature goes directly to fusion; local detection output goes to cue extraction -->
  <path class="line" d="M1235 242v32H1090v34"/>
  <path class="line" d="M1235 242v20h313v268H1255v15" marker-end="url(#arrow)"/>
  <text class="s b" x="1502" y="286">F<tspan baseline-shift="sub" font-size="11">ego,t</tspan></text>
  <text class="s" x="1045" y="266" text-anchor="end">local detection output</text>
  <ellipse class="green box" cx="1090" cy="347" rx="128" ry="40"/>
  <text class="t b" x="1090" y="340" text-anchor="middle">Cue Extractor</text>
  <text class="s" x="1090" y="365" text-anchor="middle">z<tspan baseline-shift="sub" font-size="11">t</tspan>, 21-d</text>

  <rect class="white box" x="1270" y="310" width="245" height="82" rx="10"/>
  <text class="t b" x="1392" y="338" text-anchor="middle">Channel estimator</text>
  <text class="s" x="1392" y="363" text-anchor="middle">γ̂<tspan baseline-shift="sub" font-size="11">t</tspan> (SNR, dB)</text>
  <text class="s" x="1392" y="383" text-anchor="middle">c<tspan baseline-shift="sub" font-size="11">t</tspan> (AWGN / Rayleigh)</text>

  <rect class="yellow box" x="1040" y="425" width="430" height="88" rx="13"/>
  <text class="t b" x="1255" y="456" text-anchor="middle">RF Selector</text>
  <text class="t" x="1255" y="485" text-anchor="middle">g(z<tspan baseline-shift="sub" font-size="13">t</tspan>, γ̂<tspan baseline-shift="sub" font-size="13">t</tspan>, c<tspan baseline-shift="sub" font-size="13">t</tspan>) → s<tspan baseline-shift="sub" font-size="13">t</tspan></text>
  <path class="line" d="M1090 387v38" marker-end="url(#arrow)"/>
  <path class="line" d="M1392 392v33" marker-end="url(#arrow)"/>
  <text class="xs" x="1120" y="416">z<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  <text class="xs" x="1405" y="416">γ̂<tspan baseline-shift="sub" font-size="10">t</tspan>, c<tspan baseline-shift="sub" font-size="10">t</tspan></text>

  <!-- request right-to-left, terminating at the deployment switch -->
  <path class="request" d="M1040 475H920v105H290v-13" marker-end="url(#arrowOrange)"/>
  <rect class="labelbg" x="690" y="553" width="265" height="28" rx="4"/>
  <text class="s b" x="822" y="573" text-anchor="middle" fill="#9a5a00">2-bit request (via CAM)</text>

  <!-- fusion and detection -->
  <rect class="purple box" x="1050" y="545" width="240" height="76" rx="14"/>
  <text class="t b" x="1170" y="577" text-anchor="middle">Fusion Ψ</text>
  <text class="s" x="1170" y="603" text-anchor="middle">F<tspan baseline-shift="sub" font-size="11">ego,t</tspan> + m<tspan baseline-shift="sub" font-size="11">t</tspan><tspan baseline-shift="super" font-size="11">s_t</tspan></text>
  <rect class="white box" x="1345" y="545" width="170" height="76" rx="12"/>
  <text class="t b" x="1430" y="576" text-anchor="middle">Detection head D</text>
  <path class="line" d="M1290 583h55" marker-end="url(#arrow)"/>
  <path class="line" d="M1430 621v31" marker-end="url(#arrow)"/>
  <text class="t b" x="1430" y="685" text-anchor="middle">Ŷ<tspan baseline-shift="sub" font-size="13">t</tspan> (3D boxes)</text>

  <!-- direction legend -->
  <path class="request" d="M1085 720h-145" marker-end="url(#arrowOrange)"/>
  <text class="xs" x="1012" y="742" text-anchor="middle">request: ego → collaborator</text>
  <path class="data" d="M1120 720h145" marker-end="url(#arrowBlue)"/>
  <text class="xs" x="1192" y="742" text-anchor="middle">message: collaborator → ego</text>
</svg>
